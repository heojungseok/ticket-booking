name: Build Images

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test executable jars
        run: ./gradlew clean test bootJar --no-daemon

      - name: Verify service jars
        run: |
          for module in api-gateway user-service performance-service booking-service notification-service queue-service; do
            count="$(find "$module/build/libs" -maxdepth 1 -type f -name '*.jar' | wc -l | tr -d ' ')"
            if [ "$count" -ne 1 ]; then
              printf '%s: expected exactly one jar, found %s\n' "$module" "$count" >&2
              exit 1
            fi
          done

      - name: Validate compose files
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.app.yml config --quiet

      - name: Build Docker images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ticket-booking/api-gateway:${IMAGE_TAG} api-gateway
          docker build -t ticket-booking/user-service:${IMAGE_TAG} user-service
          docker build -t ticket-booking/performance-service:${IMAGE_TAG} performance-service
          docker build -t ticket-booking/booking-service:${IMAGE_TAG} booking-service
          docker build -t ticket-booking/notification-service:${IMAGE_TAG} notification-service
          docker build -t ticket-booking/queue-service:${IMAGE_TAG} queue-service
