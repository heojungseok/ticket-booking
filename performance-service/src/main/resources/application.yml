server:
  port: ${SERVER_PORT:8002}

spring:
  application:
    name: performance-service
  datasource:
    url: ${PERFORMANCE_DB_URL:jdbc:postgresql://localhost:5433/performance_db}
    username: ${PERFORMANCE_DB_USERNAME:ticket_performance}
    password: ${PERFORMANCE_DB_PASSWORD:ticket_performance_pw}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: performance-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
